; VitalBridge — firmware del gateway (ESP32 DevKit v1 / ESP32-WROOM-32)
;
;   pio run                 # compilar
;   pio run -t upload       # grabar
;   pio device monitor      # ver el log serie (115200)
;
; Antes de grabar: copia include/secrets.example.h a include/secrets.h
; y pon tu Wi-Fi, la IP del servidor y el token.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default.csv
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
